name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test .NET applications
        run: dotnet test DockerModelRunnerLab.sln -c Release --logger "console;verbosity=normal"

      - name: Check shell scripts
        run: |
          bash -n 01-quickstart/quickstart.sh
          bash -n 02-openai-api/curl-examples.sh

      - name: Check PowerShell script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("01-quickstart/quickstart.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors; exit 1 }

      - name: Validate compose files
        shell: pwsh
        run: ./tests/compose.Tests.ps1

  quickstart-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: pwsh
          - os: windows-latest
            shell: pwsh
          - os: windows-latest
            shell: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test PowerShell 7 quickstart behavior
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./tests/quickstart.Tests.ps1
      - name: Test Windows PowerShell 5.1 quickstart behavior
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./tests/quickstart.Tests.ps1
